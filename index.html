  <script>
    // In-memory runtime state with fallback admin credentials
    let customers = [
      { code: 'CUST-1001', name: 'Apex Retail Ltd', phone: '+880 1711-234567', email: 'orders@apexretail.com', address: 'Plot 12, Gulshan-2, Dhaka', terms: 'Net 30' }
    ];
    let suppliers = [
      { code: 'SUP-201', name: 'Silicon Dynamics Ltd', phone: '+880 1722-334455', email: 'sales@silicondyn.com', address: 'Tejgaon I/A, Dhaka', lead: '5 Days' }
    ];
    let materials = [
      { code: 'MAT-501', desc: 'Microcontroller Unit', uom: 'PCS', price: 12500, cost: 8200, stock: 22, reorder: 40 },
      { code: 'MAT-502', desc: 'Lithium Cell Module', uom: 'SET', price: 4800, cost: 3100, stock: 150, reorder: 80 }
    ];
    let salesOrders = [];
    let purchaseOrders = [];
    let paymentVouchers = [];
    let users = [
      { id: 'admin', name: 'System Administrator', pass: 'admin123', role: 'Admin', status: 'Active' },
      { id: 'sales01', name: 'Sales Officer', pass: 'pass123', role: 'Sales Executive', status: 'Active' }
    ];
    let currentUser = null;

    const rolePermissions = {
      'Admin': ['dashboard', 'finance-visibility', 'post-collection', 'profit-loss', 'create-so', 'delivery-challan', 'billing-invoice', 'so-report', 'create-po', 'grn-receipt', 'po-report', 'customer-master', 'supplier-master', 'material-master', 'user-management'],
      'Sales Executive': ['dashboard', 'create-so', 'delivery-challan', 'billing-invoice', 'so-report', 'customer-master', 'material-master'],
      'Procurement Officer': ['dashboard', 'create-po', 'grn-receipt', 'po-report', 'supplier-master', 'material-master'],
      'Accounts / Finance': ['dashboard', 'finance-visibility', 'post-collection', 'profit-loss', 'billing-invoice', 'so-report', 'po-report']
    };

    function notify(msg) {
      const toast = document.getElementById('live-toast');
      const txt = document.getElementById('toast-text');
      if (txt) txt.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    // Login Handler
    window.handleLogin = function(e) {
      e.preventDefault();
      const uId = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');

      const user = users.find(u => u.id.toLowerCase() === uId.toLowerCase() && u.pass === pass);

      if (!user) {
        errorDiv.innerText = "Invalid User ID or Password. Try: admin / admin123";
        errorDiv.classList.remove('hidden');
        return;
      }

      currentUser = user;
      document.getElementById('auth-modal').classList.add('hidden');
      errorDiv.classList.add('hidden');
      document.getElementById('current-user-name').innerText = user.name;
      document.getElementById('current-user-role').innerText = user.role;
      switchTab('dashboard');
      notify(`Logged in as ${user.name}`);
    };

    window.handleLogout = function() {
      currentUser = null;
      document.getElementById('auth-modal').classList.remove('hidden');
    };

    window.initCloudERP = function() {
      if (!window.fs || !window.db) return;
      const { collection, onSnapshot } = window.fs;
      const db = window.db;

      onSnapshot(collection(db, "users"), (snap) => {
        if (!snap.empty) users = snap.docs.map(d => d.data());
      });
      onSnapshot(collection(db, "customers"), (snap) => {
        if (!snap.empty) customers = snap.docs.map(d => d.data());
        refreshViews();
      });
      onSnapshot(collection(db, "suppliers"), (snap) => {
        if (!snap.empty) suppliers = snap.docs.map(d => d.data());
        refreshViews();
      });
      onSnapshot(collection(db, "materials"), (snap) => {
        if (!snap.empty) materials = snap.docs.map(d => d.data());
        refreshViews();
      });
      onSnapshot(collection(db, "salesOrders"), (snap) => {
        if (!snap.empty) salesOrders = snap.docs.map(d => d.data());
        refreshViews();
      });
      onSnapshot(collection(db, "purchaseOrders"), (snap) => {
        if (!snap.empty) purchaseOrders = snap.docs.map(d => d.data());
        refreshViews();
      });
      onSnapshot(collection(db, "paymentVouchers"), (snap) => {
        if (!snap.empty) paymentVouchers = snap.docs.map(d => d.data());
        refreshViews();
      });
    };

    window.initOfflineFallback = function() {
      refreshViews();
    };

    window.switchTab = function(tabId) {
      if (!currentUser) return;
      document.querySelectorAll('.screen-content').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white', 'font-medium');
        b.classList.add('hover:bg-slate-800');
      });

      document.getElementById(tabId).classList.add('active');
      const btn = document.getElementById(`nav-${tabId}`);
      if (btn) {
        btn.classList.add('bg-blue-600', 'text-white', 'font-medium');
        btn.classList.remove('hover:bg-slate-800');
      }

      if (tabId === 'create-so') initCreateSO();
      if (tabId === 'create-po') initCreatePO();
      refreshViews();
    };
  </script>
